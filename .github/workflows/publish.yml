# Publishes @leadforms/n8n-nodes-leadforms to npm with a provenance statement when a version tag is pushed.
# n8n requires community nodes to be published from GitHub Actions with provenance (since May 1, 2026).
#
# Authentication: npm Trusted Publisher (no secrets). npmjs.com > @leadforms/n8n-nodes-leadforms > Settings >
# Trusted Publisher > GitHub Actions: owner vrkravchenko93-star, repository n8n-nodes-leadforms, workflow publish.yml.
#
# Release: bump "version" in package.json, commit, then tag the same version with a "v" prefix:
#   git tag v1.0.5 && git push origin v1.0.5

name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      # OIDC token for Trusted Publishing and the provenance attestation.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted Publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

      - name: Publish
        run: npm publish --provenance --access public
